<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>冰箱笔记 · 功能测试清单</title>
<style>
  :root{
    --brand:#FF9F45; --brand-soft:#FFF3E8; --bg:#FAF8F5; --card:#fff;
    --text:#1f1f1f; --sub:#8a8a8a; --line:#eee; --green:#00B96B; --red:#E34D59; --yellow:#ED7B2F;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);}
  .wrap{max-width:860px;margin:0 auto;padding:16px 16px 80px;}
  header{position:sticky;top:0;z-index:10;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line);}
  h1{font-size:20px;margin:0 0 4px;}
  .meta{font-size:12px;color:var(--sub);}
  .progress{margin-top:10px;height:10px;background:#eee;border-radius:6px;overflow:hidden;}
  .progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),#ffb877);transition:width .25s;}
  .pcount{font-size:13px;margin-top:6px;color:var(--brand);font-weight:600;}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  button.act{font-size:13px;border:1px solid var(--brand);background:var(--brand-soft);color:var(--brand);
    border-radius:20px;padding:6px 14px;cursor:pointer;}
  button.act.ghost{background:#fff;color:var(--sub);border-color:var(--line);}
  .sec{margin-top:22px;}
  .sec-h{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;margin:0 0 10px;}
  .sec-h .tag{font-size:11px;font-weight:600;color:#fff;background:var(--brand);border-radius:10px;padding:2px 8px;}
  .item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;}
  .item.done{opacity:.55;}
  .item.done .tt{text-decoration:line-through;}
  .cb{flex:0 0 22px;margin-top:2px;}
  .cb input{width:18px;height:18px;accent-color:var(--brand);cursor:pointer;}
  .body{flex:1;min-width:0;}
  .tt{font-size:14px;font-weight:600;margin-bottom:4px;}
  .row{font-size:13px;line-height:1.7;color:#444;}
  .row b{color:var(--text);font-weight:600;}
  .badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:8px;margin-left:6px;vertical-align:middle;}
  .b-dev{background:#FFF3E8;color:var(--yellow);}
  .b-real{background:#E8F4FF;color:#2b7de9;}
  .note{margin-top:12px;}
  .note textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;font-family:inherit;resize:vertical;}
  .empty{color:var(--sub);font-size:13px;text-align:center;padding:30px 0;}
  footer{text-align:center;color:var(--sub);font-size:12px;margin-top:30px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧊 冰箱笔记 · 功能测试清单</h1>
    <div class="meta">项目：miniprogram-2 ｜ AppID：wx993ca26a9925bc1b ｜ 覆盖 14 个模块</div>
    <div class="progress"><i id="bar"></i></div>
    <div class="pcount"><span id="done">0</span> / <span id="total">0</span> 项已通过</div>
    <div class="bar">
      <button class="act" id="copyBtn">复制进度与问题</button>
      <button class="act ghost" id="resetBtn">重置全部勾选</button>
    </div>
  </header>

  <div id="content"></div>

  <div class="note">
    <div class="sec-h">📝 问题记录区 <span class="tag">告诉我这里的内容即可</span></div>
    <textarea id="issues" placeholder="把测试中遇到的问题贴在这里，例如：『冰箱详情点冷藏区第二层添加物品，进去后分区还是默认第一项』。勾选项会自动保留。"></textarea>
  </div>

  <footer>进度自动保存在本机浏览器（localStorage）。每次测完一组，把本页截图或问题区文字发给我即可。</footer>
</div>

<script>

  ]},

    {t:"编辑名称入口", a:"点『冰箱名称』", e:"进入 fridge-create 编辑态", tag:"dev"},
    {t:"成员管理", a:"点『成员管理』", e:"进入 member-manage", tag:"dev"},
    {t:"分享冰箱", a:"点『分享冰箱』", e:"进入 share-qrcode", tag:"dev"},

  ]},

    {t:"所有者操作", a:"以所有者查看", e:"非所有者成员显示『改角色』『移除』按钮", tag:"dev"},
    {t:"非所有者不可见", a:"以只读/可读写成员查看", e:"不显示改角色/移除按钮，无转让入口", tag:"real"},
    {t:"改角色", a:"点『改角色』", e:"actionSheet 选择后调用 manageMember 更新角色", tag:"dev"},
    {t:"移除成员", a:"点『移除』", e:"确认弹窗后移除该成员", tag:"dev"},
    {t:"转让所有权", a:"点『转让所有权』(成员>1)", e:"选择新所有者，原所有者降为普通成员", tag:"dev"},
  ]},

    {t:"生成分享码", a:"点『生成分享码』", e:"调用 generateQRCode，显示二维码图片", tag:"dev"},
    {t:"有效期提示", a:"生成后", e:"显示『有效期7天，扫描即可加入』", tag:"dev"},
    {t:"保存到相册", a:"点『保存到相册』", e:"二维码保存到手机相册", tag:"real"},
  ]},
  {mod:"扫码加入", items:[
    {t:"扫码解析", a:"用另一微信扫码", e:"scan-result 解析参数，显示加载中→结果", tag:"real"},
    {t:"加入成功", a:"点『加入冰箱』", e:"调用 joinFridge 按权限建 user_fridge 记录，提示成功", tag:"real"},
    {t:"重复/无效处理", a:"扫已加入的码 / 无效码", e:"给出对应提示分支（已加入 / 码无效），不报错崩溃", tag:"real"},
    {t:"返回首页", a:"点『返回首页』", e:"回到首页且新冰箱出现在切换列表", tag:"real"},
  ]},
  {mod:"我的", items:[
    {t:"微信资料", a:"进入我的", e:"显示微信头像与昵称（chooseAvatar/nickname）", tag:"real"},
    {t:"主题切换", a:"点 4 套主题卡片", e:"全局即时切换主色/背景/圆角，并持久化（updateUserTheme）", tag:"dev"},
    {t:"冰箱管理", a:"我的页冰箱列表", e:"列出所有冰箱，可点进详情；『创建新冰箱』入口可用", tag:"dev"},

const KEY = "fridge_test_checked_v1";
const KEY_ISSUE = "fridge_test_issues_v1";
const checked = JSON.parse(localStorage.getItem(KEY) || "{}");
const content = document.getElementById("content");
let idSeq = 0;

DATA.forEach((sec, si)=>{
  const h = document.createElement("div");
  h.className = "sec";
  h.innerHTML = `<div class="sec-h">${si+1}. ${sec.mod}<span class="tag">${sec.items.length} 项</span></div>`;
  content.appendChild(h);
  sec.items.forEach(it=>{
    const id = "t"+(++idSeq);
    const lab = document.createElement("label");
    lab.className = "item"+(checked[id]?" done":"");
    const tagHtml = it.star ? `<span class="badge b-dev">★本次重点</span>` : (it.tag==="real"?`<span class="badge b-real">需真机</span>`:`<span class="badge b-dev">模拟器</span>`);
    lab.innerHTML = `
      <span class="cb"><input type="checkbox" data-id="${id}" ${checked[id]?"checked":""}></span>
      <span class="body">
        <div class="tt">${it.t}${tagHtml}</div>
        <div class="row"><b>操作：</b>${it.a}</div>
        <div class="row"><b>预期：</b>${it.e}</div>
      </span>`;
    content.appendChild(lab);
  });
});

const all = [...document.querySelectorAll('input[type=checkbox]')];
const totalEl = document.getElementById("total");
const doneEl = document.getElementById("done");
const bar = document.getElementById("bar");
totalEl.textContent = all.length;

function refresh(){
  let c=0;
  all.forEach(i=>{ if(i.checked) c++; i.closest(".item").classList.toggle("done", i.checked); });
  doneEl.textContent = c;
  bar.style.width = (c/all.length*100)+"%";
}
all.forEach(i=> i.addEventListener("change", ()=>{
  checked[i.dataset.id] = i.checked;
  localStorage.setItem(KEY, JSON.stringify(checked));
  refresh();
}));
refresh();

document.getElementById("resetBtn").addEventListener("click", ()=>{
  if(!confirm("确定清空所有勾选？")) return;
  all.forEach(i=>{ i.checked=false; });
  localStorage.removeItem(KEY);
  Object.keys(checked).forEach(k=>delete checked[k]);
  refresh();
});

document.getElementById("issues").value = localStorage.getItem(KEY_ISSUE) || "";
document.getElementById("issues").addEventListener("input", e=>{
  localStorage.setItem(KEY_ISSUE, e.target.value);
});

document.getElementById("copyBtn").addEventListener("click", ()=>{
  let txt = "【冰箱笔记 测试进度】\n";
  txt += `已通过 ${doneEl.textContent}/${all.length}\n\n`;
  let seq=0; const lines=[];
  DATA.forEach((sec,si)=>{
    lines.push(`\n■ ${si+1}. ${sec.mod}`);
    sec.items.forEach(it=>{
      seq++; const id="t"+seq; const ok=checked[id]?"✅":"⬜";
      lines.push(`${ok} ${it.t}`);
    });
  });
  txt += lines.join("\n");
  const iss = document.getElementById("issues").value.trim();
  if(iss) txt += "\n\n【问题记录】\n"+iss;
  navigator.clipboard.writeText(txt).then(()=> alert("已复制进度到剪贴板，发给我即可")).catch(()=>{
    prompt("复制以下内容：", txt);
  });
});
</script>
</body>
</html>
