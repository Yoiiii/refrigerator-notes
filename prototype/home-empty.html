<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>首页（空状态）- 冰箱笔记</title>
  <style>
    :root {
      --brand: #FF9F45;
      --brand-hover: #FF8A1F;
      --brand-light: rgba(255,159,69,0.08);
      --bg: #FAF8F5;
      --card: #FFFFFF;
      --text: rgba(0,0,0,0.88);
      --text-secondary: rgba(0,0,0,0.55);
      --text-placeholder: rgba(0,0,0,0.35);
      --separator: rgba(0,0,0,0.04);
      --radius-btn: 8px;
      --radius-round: 999px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

    body {
      font-family: 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .status-bar {
      height: 54px;
      background: var(--bg);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 28px 8px;
      font-size: 15px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .nav-bar {
      height: 48px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      flex-shrink: 0;
      position: relative;
    }

    .nav-title {
      font-size: 18px;
      font-weight: 700;
    }

    .nav-right {
      position: absolute;
      right: 16px;
      display: flex;
      gap: 18px;
    }

    .nav-icon { font-size: 18px; }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 40px;
      text-align: center;
    }

    .empty-illustration {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FFF0E0 0%, #FFE8D0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      margin-bottom: 28px;
      box-shadow: 0 8px 24px rgba(255,159,69,0.12);
    }

    .empty-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .empty-desc {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 36px;
    }

    .create-btn {
      width: 100%;
      max-width: 260px;
      height: 48px;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: var(--radius-btn);
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(255,159,69,0.25);
    }

    .skip-link {
      margin-top: 16px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .tab-bar {
      height: 56px;
      background: var(--card);
      border-top: 0.5px solid var(--separator);
      display: flex;
      align-items: flex-start;
      justify-content: space-around;
      flex-shrink: 0;
      padding-top: 6px;
      padding-bottom: 28px;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 10px;
      color: var(--text-placeholder);
    }

    .tab-item .tab-icon { font-size: 20px; line-height: 1; }
    .tab-item.active { color: var(--brand); }
  </style>
</head>
<body>
  <div class="status-bar">
    <span>9:41</span>
    <span style="font-size:13px;">🔋 100%</span>
  </div>

  <div class="nav-bar">
    <span class="nav-title">冰箱笔记</span>
    <div class="nav-right">
      <span class="nav-icon">🔔</span>
    </div>
  </div>

  <div class="content">
    <div class="empty-illustration">🧊</div>
    <div class="empty-title">还没有冰箱</div>
    <div class="empty-desc">创建一个冰箱，开始记录<br/>食材的存放位置与保质期</div>
    <div class="create-btn">➕ 创建冰箱</div>
    <div class="skip-link">先随便看看</div>
  </div>

  <div class="tab-bar">
    <div class="tab-item active">
      <span class="tab-icon">🏠</span>
      <span>首页</span>
    </div>
    <div class="tab-item">
      <span class="tab-icon">👤</span>
      <span>我的</span>
    </div>
  </div>
</body>
</html>
