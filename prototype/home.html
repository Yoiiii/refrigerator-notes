<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>首页 - 冰箱笔记</title>
  <style>
    :root {
      --brand: #FF9F45;
      --brand-hover: #FF8A1F;
      --brand-light: rgba(255,159,69,0.08);
      --brand-lighter: rgba(255,159,69,0.04);
      --success: #00A870;
      --success-bg: rgba(0,168,112,0.08);
      --warning: #E37318;
      --warning-bg: rgba(227,115,24,0.08);
      --error: #D54941;
      --error-bg: rgba(213,73,65,0.08);
      --bg: #FAF8F5;
      --card: #FFFFFF;
      --text: rgba(0,0,0,0.88);
      --text-secondary: rgba(0,0,0,0.55);
      --text-placeholder: rgba(0,0,0,0.35);
      --border: rgba(0,0,0,0.06);
      --separator: rgba(0,0,0,0.04);
      --radius-card: 12px;
      --radius-btn: 8px;
      --radius-input: 6px;
      --radius-round: 999px;
      --shadow-card: 0 4px 12px rgba(255,159,69,0.10);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

    body {
      font-family: 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .status-bar {
      height: 54px;
      background: var(--bg);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 28px 8px;
      font-size: 15px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .nav-bar {
      height: 48px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      flex-shrink: 0;
      position: relative;
    }

    .nav-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .nav-right {
      position: absolute;
      right: 16px;
      display: flex;
      gap: 18px;
    }

    .nav-icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* 冰箱卡片 */
    .fridge-card {
      margin: 12px 16px;
      background: var(--card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }

    .fridge-card-head {
      display: flex;
      align-items: center;
      padding: 18px 16px;
      gap: 14px;
    }

    .fridge-avatar {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: linear-gradient(135deg, #FFF0E0 0%, #FFE0C0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      flex-shrink: 0;
    }

    .fridge-info {
      flex: 1;
      min-width: 0;
    }

    .fridge-name {
      font-size: 17px;
      font-weight: 600;
    }

    .fridge-desc {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    .fridge-arrow {
      color: var(--text-placeholder);
      font-size: 20px;
      flex-shrink: 0;
    }

    .fridge-stats {
      display: flex;
      border-top: 0.5px solid var(--separator);
    }

    .fridge-stat {
      flex: 1;
      padding: 14px 0;
      text-align: center;
      border-right: 0.5px solid var(--separator);
    }

    .fridge-stat:last-child { border-right: none; }

    .fridge-stat .num {
      font-size: 20px;
      font-weight: 700;
      display: block;
    }

    .fridge-stat .label {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
      display: block;
    }

    /* 切换冰箱 */
    .switch-bar {
      margin: 0 16px 12px;
      padding: 12px;
      text-align: center;
      font-size: 14px;
      color: var(--brand);
      font-weight: 500;
      background: var(--card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-sm);
    }

    /* 临期提醒 */
    .expire-banner {
      margin: 0 16px 12px;
      padding: 14px 16px;
      border-radius: var(--radius-card);
      background: linear-gradient(135deg, #FFF7EE 0%, #FFF0E0 100%);
      display: flex;
      align-items: center;
      gap: 12px;
      border: 0.5px solid rgba(255,159,69,0.12);
    }

    .expire-banner .banner-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,159,69,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .expire-banner .banner-text {
      flex: 1;
      font-size: 14px;
      color: #8B5E30;
      line-height: 1.4;
    }

    .expire-banner .banner-text strong {
      color: #C47720;
      font-weight: 600;
    }

    .expire-banner .banner-action {
      font-size: 13px;
      color: var(--brand);
      font-weight: 500;
      flex-shrink: 0;
    }

    /* 快捷操作 */
    .quick-actions {
      margin: 0 16px 16px;
      display: flex;
      gap: 10px;
    }

    .quick-btn {
      flex: 1;
      height: 44px;
      border-radius: var(--radius-btn);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 15px;
      font-weight: 500;
    }

    .quick-btn.primary {
      background: var(--brand);
      color: #fff;
    }

    .quick-btn.outline {
      background: var(--card);
      color: var(--brand);
      border: 1px solid var(--brand);
    }

    /* 临期物品列表 */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px 4px;
    }

    .section-header .s-title {
      font-size: 16px;
      font-weight: 600;
    }

    .section-header .s-more {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .recent-list {
      margin: 0 16px 20px;
      background: var(--card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .recent-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 0.5px solid var(--separator);
    }

    .recent-item:last-child { border-bottom: none; }

    .recent-item .item-emoji {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .recent-item .item-info { flex: 1; }

    .recent-item .item-name {
      font-size: 15px;
      font-weight: 500;
    }

    .recent-item .item-location {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .recent-item .item-status {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: var(--radius-round);
      font-weight: 500;
      flex-shrink: 0;
    }

    .item-status.safe { background: var(--success-bg); color: var(--success); }
    .item-status.warning { background: var(--warning-bg); color: var(--warning); }
    .item-status.danger { background: var(--error-bg); color: var(--error); }

    /* TabBar */
    .tab-bar {
      height: 56px;
      background: var(--card);
      border-top: 0.5px solid var(--separator);
      display: flex;
      align-items: flex-start;
      justify-content: space-around;
      flex-shrink: 0;
      padding-top: 6px;
      padding-bottom: 28px;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 10px;
      color: var(--text-placeholder);
    }

    .tab-item .tab-icon { font-size: 20px; line-height: 1; }
    .tab-item.active { color: var(--brand); }
  </style>
</head>
<body>
  <div class="status-bar">
    <span>9:41</span>
    <span style="font-size:13px;">🔋 100%</span>
  </div>

  <div class="nav-bar">
    <span class="nav-title">冰箱笔记</span>
    <div class="nav-right">
      <span class="nav-icon">🔔</span>
      <span class="nav-icon">➕</span>
    </div>
  </div>

  <div class="content">
    <!-- 冰箱卡片 -->
    <div class="fridge-card">
      <div class="fridge-card-head">
        <div class="fridge-avatar">🧊</div>
        <div class="fridge-info">
          <div class="fridge-name">客厅冰箱</div>
          <div class="fridge-desc">双开门 · 冷藏+冷冻</div>
        </div>
        <span class="fridge-arrow">›</span>
      </div>
      <div class="fridge-stats">
        <div class="fridge-stat">
          <span class="num">12</span>
          <span class="label">物品总数</span>
        </div>
        <div class="fridge-stat">
          <span class="num" style="color: var(--warning);">3</span>
          <span class="label">临期</span>
        </div>
        <div class="fridge-stat">
          <span class="num" style="color: var(--error);">1</span>
          <span class="label">已过期</span>
        </div>
      </div>
    </div>

    <!-- 切换冰箱 -->
    <div class="switch-bar">🔄 切换冰箱</div>

    <!-- 临期提醒 -->
    <div class="expire-banner">
      <div class="banner-icon">⚠️</div>
      <div class="banner-text">
        <strong>3 件物品</strong>即将在 3 天内过期
      </div>
      <span class="banner-action">查看 ›</span>
    </div>

    <!-- 快捷操作 -->
    <div class="quick-actions">
      <div class="quick-btn primary">➕ 添加物品</div>
      <div class="quick-btn outline">📋 管理冰箱</div>
    </div>

    <!-- 临期物品列表 -->
    <div class="section-header">
      <span class="s-title">临期物品</span>
      <span class="s-more">查看全部 ›</span>
    </div>

    <div class="recent-list">
      <div class="recent-item">
        <div class="item-emoji">🥩</div>
        <div class="item-info">
          <div class="item-name">五花肉</div>
          <div class="item-location">冷藏区 · 第3层 · 过期 2 天</div>
        </div>
        <span class="item-status danger">已过期</span>
      </div>
      <div class="recent-item">
        <div class="item-emoji">🥚</div>
        <div class="item-info">
          <div class="item-name">鸡蛋</div>
          <div class="item-location">冷藏区 · 第2层 · 剩余 2 天</div>
        </div>
        <span class="item-status warning">临期</span>
      </div>
      <div class="recent-item">
        <div class="item-emoji">🥟</div>
        <div class="item-info">
          <div class="item-name">速冻饺子</div>
          <div class="item-location">冷冻区 · 第3层 · 剩余 1 天</div>
        </div>
        <span class="item-status warning">临期</span>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item active">
      <span class="tab-icon">🏠</span>
      <span>首页</span>
    </div>
    <div class="tab-item">
      <span class="tab-icon">👤</span>
      <span>我的</span>
    </div>
  </div>
</body>
</html>
